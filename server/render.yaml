databases:
  - name: smart-habit-db
    region: singapore
    plan: basic-256mb
    databaseName: smart_habit
    user: smart_habit
    ipAllowList: []

services:
  - type: keyvalue
    name: smart-habit-jobs
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList:
      - source: 0.0.0.0/32
        description: Block practical external access; services use the internal URL

  - type: web
    name: smart-habit-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.api
    preDeployCommand: pnpm db:migrate
    healthCheckPath: /v1/health/ready
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smart-habit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smart-habit-jobs
          type: keyvalue
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: worker
    name: smart-habit-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile.worker
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-habit-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: smart-habit-jobs
          type: keyvalue
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64
        sync: false
      - key: SENTRY_DSN
        sync: false
