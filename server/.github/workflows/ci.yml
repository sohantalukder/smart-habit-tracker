name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build -f Dockerfile.api -t smart-habit-api:ci .
      - run: docker build -f Dockerfile.worker -t smart-habit-worker:ci .
